name: 📚 Docs
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  # The changelog page is built from GitHub Releases. The release job creates
  # them with GITHUB_TOKEN, and events from that token never start other
  # workflows, so `release: published` would never fire. Rebuild when CI —
  # whose last job is the release — finishes green on main instead.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy.yml@main
    with:
      build-filter: '@rtorcato/repo-ai-docs'
