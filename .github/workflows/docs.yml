name: 📚 Docs
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  # Rebuild when CI finishes green on main, so changes outside apps/docs (the
  # schemas it serves) reach the site. The changelog page is built from GitHub
  # Releases, which the release only creates after its approval: release.yml
  # dispatches this workflow once it has published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # https://docs.torcato.dev/repo-ai/
  cloudflare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: rtorcato/repo-tooling/.github/workflows/docs-deploy-cloudflare.yml@863492b9f3b85c60085a8435b372990ffc755b68 # main as of 2026-09-30
    with:
      build-filter: '@rtorcato/repo-ai-docs'
      worker-name: repo-ai-docs
      base-path: /repo-ai/
      route: docs.torcato.dev/repo-ai/*
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
